<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Access & Sign In | Living-Ora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navigation Bar Placeholder -->
  <div id="navbar-placeholder"></div>

  <main class="container" style="padding-top: 3.5rem; padding-bottom: 4rem; display: flex; justify-content: center;">
    <div class="card" style="max-width: 520px; width: 100%; padding: 2.25rem;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <span class="badge badge-gold" style="margin-bottom: 0.5rem;">Verified Access</span>
        <h1 style="font-size: 1.85rem; font-weight: 800;">Living-Ora Portal Sign In</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">
          Sign in to access your workspace. Customers, sales agents, and staff members are automatically routed to their dashboards based on verified permissions.
        </p>
      </div>

      <!-- Alert Box -->
      <div id="auth-alert" class="alert" style="display: none;"></div>

      <!-- Tab Switcher -->
      <div class="tabs-nav" style="justify-content: center; margin-bottom: 1.5rem;">
        <button id="tab-login-btn" class="tab-btn active">Sign In / Login</button>
        <button id="tab-signup-btn" class="tab-btn">Create Account</button>
      </div>

      <!-- Unified Login Form (Works for all roles) -->
      <form id="auth-login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="e.g. client@livingora.lk or staff@livingora.lk" required />
          <small style="color: var(--text-dim); font-size: 0.78rem; display: block; margin-top: 0.3rem;">
            Internal staff can use their work email (e.g. admin@livingora.lk, sales.mgr@livingora.lk).
          </small>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">Sign In to Living-Ora</button>
      </form>

      <!-- Signup Form -->
      <form id="auth-signup-form" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="signup-role">Account Type</label>
          <select id="signup-role" class="form-select">
            <option value="CUSTOMER">Individual Customer / Buyer</option>
            <option value="SALES_AGENT">External Real Estate Sales Agent</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="signup-firstname">First Name *</label>
            <input type="text" id="signup-firstname" class="form-input" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-lastname">Last Name *</label>
            <input type="text" id="signup-lastname" class="form-input" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="signup-nic">NIC / Passport *</label>
            <input type="text" id="signup-nic" class="form-input" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-age">Age *</label>
            <input type="number" id="signup-age" class="form-input" min="18" max="100" value="28" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-phone">Phone Number *</label>
          <input type="tel" id="signup-phone" class="form-input" placeholder="+94 77 123 4567" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-address">Permanent Address *</label>
          <input type="text" id="signup-address" class="form-input" placeholder="No. 12, Flower Road, Colombo 07" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address *</label>
          <input type="email" id="signup-email" class="form-input" placeholder="client@example.com" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-password">Password (Minimum 8 chars) *</label>
          <input type="password" id="signup-password" class="form-input" minlength="8" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">Create Account</button>
      </form>
    </div>
  </main>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Script Module -->
  <script type="module" src="js/pages/auth.js"></script>
</body>
</html>
