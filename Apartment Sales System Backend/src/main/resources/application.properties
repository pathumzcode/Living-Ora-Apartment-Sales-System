spring.application.name=Apartment Sales System Backend

# Database Configuration for MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/apartment%20sales%20system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
# Local development fallback matches the existing MySQL root account. Set DB_PASSWORD in
# IntelliJ/your environment for any shared or production deployment.
spring.datasource.password=${DB_PASSWORD:Shan.123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA Settings
# The MySQL Workbench schema is the source of truth.  Validate the existing
# tables on startup; Hibernate must never create or modify a table.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Use the column/table names from the supplied Workbench schema exactly; do not
# silently convert camelCase names into a second snake_case set of columns.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Disable open-in-view to prevent accidental DB queries during view rendering
spring.jpa.open-in-view=false
